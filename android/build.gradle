plugins {
    id 'com.android.library'
}

// AGP 9+ can provide built-in Kotlin support, but only when the consuming app has
// opted in via android.builtInKotlin=true. Checking the AGP version alone is not
// enough: on AGP 9+ with built-in Kotlin still disabled, Kotlin sources would
// silently go uncompiled. Fall back to applying the plugin explicitly in that case.
def builtInKotlinEnabled = findProperty('android.builtInKotlin')?.toString()?.toBoolean() ?: false
if (!builtInKotlinEnabled) {
    apply plugin: 'kotlin-android'
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

group 'com.prongbang.screen_protector'

android {
    namespace 'com.prongbang.screen_protector'
    compileSdk 36

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    defaultConfig {
        minSdk 21
        targetSdk 36
    }

    lintOptions {
        disable 'InvalidPackage'
    }
}